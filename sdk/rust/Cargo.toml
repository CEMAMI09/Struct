[package]
name = "struct-device"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Authenticated binary telemetry with bounded UDP storage receipts"
readme = "README.md"
publish = false

[dependencies]
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[dev-dependencies]
hex = "0.4"
