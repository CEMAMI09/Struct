name: SDK compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci && npm --prefix tcp-server ci && npm --prefix web ci
      - run: python -m pip install './sdk/python[encryption]' build
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - run: npm test
      - run: python -m unittest discover -s sdk/python -v
      - run: cargo test --locked --manifest-path sdk/rust/Cargo.toml && cargo build --locked --manifest-path sdk/rust/Cargo.toml --example telemetry
      - run: node tests/sdk-parity.cjs
      - run: cmake -S sdk/c -B build/c -DSTRUCT_BUILD_TESTS=ON && cmake --build build/c && ctest --test-dir build/c --output-on-failure
      - run: npm run build:web && python scripts/package-sdk.py
      - run: python -m build sdk/python && npm pack ./sdk/js --pack-destination sdk/python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-candidates
          path: |
            sdk/python/dist/*
            web/public/sdk/*.zip
  # Physical rigs are deliberately manual, not exposed to untrusted PR code.
  # Release qualification is separately checked by scripts/check-sdk-release.cjs.
